name: Metrificar Commits em Tempo Real

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  registrar_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular tempo decorrido e enviar commit para planilha
        env:
          WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.username }}
          MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - << 'EOF'
          import os, re, json, subprocess, urllib.request
          from datetime import datetime

          branch = os.environ["BRANCH_NAME"]
          
          match = re.search(r"(\d+)", branch)
          estimativa = int(match.group(1)) if match else 1

          try:
              cmd = ["git", "log", "origin/main..HEAD", "--reverse", "--format=%cI"]
              commits = subprocess.check_output(cmd).decode("utf-8").strip().splitlines()
              data_inicio_str = commits[0] if commits else os.environ["COMMIT_TIME"]
          except Exception:
              data_inicio_str = os.environ["COMMIT_TIME"]

          inicio = datetime.fromisoformat(data_inicio_str)
          atual = datetime.fromisoformat(os.environ["COMMIT_TIME"])
          dias_decorridos = round((atual - inicio).total_seconds() / 86400, 2)

          primeira_linha_msg = os.environ["MESSAGE"].splitlines()[0]
          tarefa_completa = f"[{branch}] {primeira_linha_msg}"

          payload = json.dumps({
              "projeto": os.environ["REPO_NAME"],
              "autor": os.environ["AUTHOR"] or os.environ["GITHUB_ACTOR"],
              "tarefa": tarefa_completa,
              "estimativa": estimativa,
              "tempoReal": dias_decorridos
          }).encode("utf-8")

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          EOF
